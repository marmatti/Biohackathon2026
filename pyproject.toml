[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biohackathon-filament"
version = "0.1.0"
description = "Filament segmentation pipeline with SegmentTracker"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "Pillow>=9.0",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "scikit-image>=0.19",
    "pandas>=1.3",
    "imageio[ffmpeg]>=2.9",
]

[project.optional-dependencies]
segment-tracker = ["imageio[ffmpeg]>=2.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["workflow*"]
